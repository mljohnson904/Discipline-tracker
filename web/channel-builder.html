<title>Channel Builder</title>
<style>
:root{--bg:#f7f5f0;--card:#ffffff;--ink:#1f2933;--muted:#5b6770;--accent:#2f6f5e;--accent-soft:#dcefe9;--line:#d9d4c7;
--on-accent:#ffffff;--info:#1f5f99;--info-soft:#e3eefa;--attn:#7a5000;--attn-soft:#fdf1d6;--over:#b03a14;--over-soft:#fbe9e2;
--g-plan:#2f6f5e;--g-grade:#1f5f99;--g-manage:#6a4c93;--g-support:#7a5524;
--gs-plan:#dcefe9;--gs-grade:#e3eefa;--gs-manage:#ece6f6;--gs-support:#f3eadb;
--seed:#fdf1d6;--on-seed:#7a5000;--seed-line:#e8cf8a;
--radius:10px;--ab-h:52px;--bar-h:60px;
--mute:var(--muted);--warn:var(--over);--warnbg:var(--over-soft);--ok:var(--accent)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161a1d;--card:#20262b;--ink:#e6e9ec;--muted:#9aa5ae;--accent:#6cc3ab;--accent-soft:#1f3a34;--line:#343d44;
--on-accent:#0e1a16;--info:#8ec1f0;--info-soft:#1d2f44;--attn:#f0c060;--attn-soft:#3a2f12;--over:#ff9a78;--over-soft:#43211a;
--g-plan:#6cc3ab;--g-grade:#8ec1f0;--g-manage:#c0a8ee;--g-support:#e0b878;
--gs-plan:#1f3a34;--gs-grade:#1d2f44;--gs-manage:#2a2340;--gs-support:#3a2f1c;
--seed:#3a2f12;--on-seed:#f0c060;--seed-line:#5a4a1f;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#161a1d;--card:#20262b;--ink:#e6e9ec;--muted:#9aa5ae;--accent:#6cc3ab;--accent-soft:#1f3a34;--line:#343d44;
--on-accent:#0e1a16;--info:#8ec1f0;--info-soft:#1d2f44;--attn:#f0c060;--attn-soft:#3a2f12;--over:#ff9a78;--over-soft:#43211a;
--g-plan:#6cc3ab;--g-grade:#8ec1f0;--g-manage:#c0a8ee;--g-support:#e0b878;
--gs-plan:#1f3a34;--gs-grade:#1d2f44;--gs-manage:#2a2340;--gs-support:#3a2f1c;
--seed:#3a2f12;--on-seed:#f0c060;--seed-line:#5a4a1f;color-scheme:dark;}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--ab-h) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:var(--accent)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-999px;top:8px}.skip:focus{left:8px;z-index:100;background:var(--card);color:var(--ink);padding:8px 12px;border-radius:8px;border:2px solid var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

/* ---- group colors ---- */
.grp[data-grp="plan"],section.panel[data-grp="plan"]{--grp:var(--g-plan);--grp-soft:var(--gs-plan)}
.grp[data-grp="grade"],section.panel[data-grp="grade"]{--grp:var(--g-grade);--grp-soft:var(--gs-grade)}
.grp[data-grp="manage"],section.panel[data-grp="manage"]{--grp:var(--g-manage);--grp-soft:var(--gs-manage)}
.grp[data-grp="support"],section.panel[data-grp="support"]{--grp:var(--g-support);--grp-soft:var(--gs-support)}

/* ---- app bar ---- */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:6px;height:var(--ab-h);padding:0 10px;background:var(--card);border-bottom:1px solid var(--line)}
.ab-brand{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:0 8px;border-radius:8px;cursor:pointer;min-height:44px;white-space:nowrap}
.ab-brand .ic{color:var(--accent)}
.ab-long{display:none}
.ab-search{position:relative;flex:1 1 auto;min-width:0;display:none}
.appbar.searching .ab-search{display:block;position:absolute;left:8px;right:8px;top:4px;z-index:2}
.ab-search input{padding-left:36px;background:var(--card)}
.ab-search>.ic{position:absolute;left:10px;top:13px;pointer-events:none;color:var(--muted)}
.ab-spacer{flex:1 1 auto}
.tchip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:.88rem;font-weight:600;text-decoration:none;white-space:nowrap}
.tchip .chip-d{display:none;font-weight:400;color:var(--muted);margin-left:6px}
button.ico{width:44px;min-height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;color:var(--ink);border-radius:8px;cursor:pointer}
button.ico:hover,.ab-brand:hover{background:var(--accent-soft)}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#themeBtn .ic-sun{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #themeBtn .ic-sun{display:block}:root:not([data-theme="light"]) #themeBtn .ic-moon{display:none}}
:root[data-theme="dark"] #themeBtn .ic-sun{display:block}:root[data-theme="dark"] #themeBtn .ic-moon{display:none}
#aboutPop{position:absolute;left:8px;top:calc(var(--ab-h) - 2px);width:min(380px,calc(100vw - 16px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:45}
#aboutPop p{margin:0 0 8px}
#gresults{position:absolute;left:0;right:0;top:48px;max-height:60vh;overflow-y:auto;margin:0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:50}
#gresults li{padding:8px 10px;border-radius:8px;cursor:pointer;min-height:44px}
#gresults li[aria-selected="true"],#gresults li:hover{background:var(--accent-soft)}
#gresults .r-top{display:flex;gap:8px;align-items:baseline}
#gresults .r-tab{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
#gresults .r-snip{font-size:.85rem;color:var(--muted)}
#gresults mark{background:var(--attn-soft);color:var(--ink);border-radius:3px;padding:0 2px}
#gresults .r-none{padding:10px;color:var(--muted);cursor:default}

/* ---- shell: bottom bar on phones, sidebar on desktop ---- */
.shell{display:block}.content{min-width:0}
main{max-width:1100px;margin:0 auto;padding:12px 16px calc(var(--bar-h) + 28px)}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);z-index:40;background:var(--card);border-top:1px solid var(--line)}
#nav .inner{display:grid;grid-template-columns:repeat(5,1fr);height:var(--bar-h)}
#nav .grp{position:relative;display:flex;min-width:0}
#nav .grp-label{display:none}
#nav .grp-toggle,#nav .grp.solo .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.72rem;min-height:var(--bar-h);padding:4px 2px;cursor:pointer;border-radius:0;width:auto;text-align:center;text-decoration:none}
#nav .grp.solo .grp-tabs{display:contents}
#nav .grp.has-active>.grp-toggle,#nav .grp.solo .tab[aria-current="page"]{color:var(--grp);font-weight:700;box-shadow:inset 0 3px 0 var(--grp);background:var(--grp-soft)}
#nav .grp:not(.solo) .grp-tabs{display:none;position:fixed;left:8px;right:8px;bottom:calc(var(--bar-h) + 8px + env(safe-area-inset-bottom,0px));flex-direction:column;gap:2px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.25)}
#nav .grp.open .grp-tabs{display:flex}
.tab{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 12px;border-radius:8px;background:transparent;color:var(--ink);font:inherit;text-align:left;text-decoration:none}
.tab .ic{color:var(--grp)}
#nav .grp-toggle .ic,#nav .grp.solo .tab .ic{color:inherit;width:22px;height:22px}
.tab:hover{background:var(--grp-soft)}
.tab[aria-current="page"]{background:var(--grp-soft);color:var(--grp);font-weight:700;box-shadow:inset 3px 0 0 var(--grp)}
@media (min-width:480px){.ab-long{display:inline}.tchip .chip-d{display:inline}}
@media (min-width:700px){.ab-search{display:block;max-width:420px;margin-left:8px}#searchBtn{display:none}.ab-spacer{display:none}.appbar{padding:0 14px}.appbar .tchip{margin-left:auto}}
@media (min-width:1000px){
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);max-width:1440px;margin:0 auto}
#nav{position:sticky;top:var(--ab-h);left:auto;right:auto;bottom:auto;height:calc(100vh - var(--ab-h));overflow-y:auto;border-top:0;border-right:1px solid var(--line);background:transparent;padding:12px 10px;align-self:start}
#nav .inner{display:block;height:auto}
#nav .grp{display:block;margin-bottom:14px}#nav .grp.solo{margin-bottom:8px}
#nav .grp-label{display:block;margin:0 0 4px 10px;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--grp)}
#nav .grp-toggle{display:none}
#nav .grp.solo .tab,#nav .grp .tab{color:var(--ink);flex-direction:row;justify-content:flex-start;min-height:44px;font-size:1rem;padding:8px 12px;text-align:left;border-radius:8px;width:100%}
#nav .grp.solo .tab .ic,#nav .grp .tab .ic{width:20px;height:20px;color:var(--grp)}
#nav .grp.solo .tab[aria-current="page"],#nav .grp .tab[aria-current="page"]{box-shadow:inset 3px 0 0 var(--grp);color:var(--grp);background:var(--grp-soft)}
#nav .grp:not(.solo) .grp-tabs,#nav .grp.open .grp-tabs{display:flex;position:static;flex-direction:column;padding:0;background:transparent;border:0;box-shadow:none;gap:2px}
#nav .grp.has-active>.grp-toggle{box-shadow:none}
main{padding:16px 20px 40px}
}
section.panel.active{animation:panelIn .18s ease-out}@keyframes panelIn{from{opacity:0}to{opacity:1}}

/* ---- typography ---- */
h1{font-size:1.5rem;line-height:1.25;margin:.3em 0 .5em}
h2{font-size:1.2rem;line-height:1.25;font-weight:700;margin:1.6em 0 .6em;padding-left:12px;border-left:4px solid var(--grp,var(--accent))}
h2 small{color:var(--muted);font-weight:400;font-size:.8rem}
h3{margin:.3em 0;font-size:1.02rem}h4{margin:.6em 0 .2em;font-size:.95rem;color:var(--grp,var(--accent))}
.card h3{color:var(--grp,var(--accent))}
.muted{color:var(--muted);font-size:.9rem}
.note{background:var(--accent-soft);padding:8px 12px;border-radius:8px;font-size:.9rem}
p,li{max-width:72ch}.grid p,.card p,td,th{max-width:none}

/* ---- cards, grids ---- */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card.dim{opacity:.7}
.stats{display:flex;gap:8px;margin:10px 0}.stats div{flex:1;background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-size:1.25rem}.stats span{color:var(--muted);font-size:.78rem}
dl{margin:0}dt{font-size:.85rem;color:var(--muted);margin-top:8px}dd{margin:0;font-size:1.15rem;font-weight:600}dd small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
.flag{background:var(--over-soft);color:var(--over);border-left:4px solid var(--over);padding:6px 12px;border-radius:0 8px 8px 0;margin-top:8px;font-size:.88rem;font-weight:600}
.flag-inline{color:var(--over);font-weight:700}
.flash{background:var(--accent-soft);color:var(--ink);border-left:4px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;font-weight:600}
.badge{display:inline-block;font-size:.72rem;padding:1px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);margin:2px 2px 2px 0;white-space:nowrap}
.badge.seed{background:var(--seed);color:var(--on-seed);border-color:var(--seed-line)}
.p-tiktok{border-color:#25c4d6}.p-youtube{border-color:#e5484d}.p-instagram{border-color:#c13584}
.badge.t-ok{background:var(--accent);color:var(--on-accent);border-color:transparent}
.badge.t-long{background:var(--over);color:#fff;border-color:transparent}
.badge.t-short{background:var(--seed);color:var(--on-seed);border-color:var(--seed-line)}

/* ---- segmented toggle, chips, tables ---- */
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px;background:var(--card)}
.toggle a{padding:10px 18px;text-decoration:none;color:var(--ink);min-height:44px;display:inline-flex;align-items:center}.toggle a.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;margin:2px 4px 2px 0;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);text-decoration:none;font-size:.85rem}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.chip small{opacity:.7;margin-left:4px}
.toplist{padding-left:20px}.toplist li{margin:8px 0}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:.9rem;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:.85rem}
tr.rate td{background:var(--accent-soft);font-style:italic}
.metric{font-size:.9rem;margin-top:4px}.win{font-weight:700;background:var(--accent-soft);padding:1px 7px;border-radius:6px}
.hook{font-style:italic;margin-top:4px;font-size:.92rem}
.titlebar{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---- buttons and forms ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:8px;font:inherit;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--over)}.btn.small{min-height:36px;padding:4px 12px;font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.row{display:flex;flex-wrap:wrap;gap:12px}.row>label{flex:1 1 150px}
label{display:flex;flex-direction:column;font-size:.85rem;font-weight:600;color:var(--muted);gap:4px}
label.check{flex-direction:row;align-items:center;color:var(--ink);align-self:end;font-weight:400;min-height:44px}
input,select,textarea{font:inherit;color:var(--ink);padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-height:44px}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
::placeholder{color:var(--muted);opacity:1}
fieldset{border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}legend{font-weight:600;padding:0 6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:10px 0}.filters label{flex:1 1 140px}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;min-height:32px}
form.inline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}form.inline input[type=number]{width:90px}

/* ---- dashboard bits ---- */
.bar{position:relative;display:flex;justify-content:space-between;padding:3px 8px;margin:3px 0;font-size:.85rem;border-radius:6px;overflow:hidden;background:var(--bg)}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--grp,var(--accent));opacity:.25}.bar span,.bar b{position:relative}
.aud{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.hero{display:flex;align-items:center;gap:18px;margin:2px 0}
.hero-big{font-size:1.55rem;font-weight:800;line-height:1.15}
.hero-focus{font-size:1.05rem;font-weight:600;margin:6px 0}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}.ring svg{width:100%;height:100%}
.ring-bg{fill:none;stroke:var(--line);stroke-width:9}.ring-fg{fill:none;stroke:var(--grp,var(--accent));stroke-width:9;stroke-linecap:round}
.ring-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.ring-t b{font-size:1.9rem;line-height:1}.ring-t span{font-size:.75rem;color:var(--muted)}

/* ---- series / hooks / scripts / checklist / review / ask ---- */
.partpost{padding:8px 0;border-top:1px solid var(--line)}.partpost:first-of-type{border-top:0}.part h3 .muted{font-weight:400}
.ideas{list-style:none;padding:0}.ideas li{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 12px;margin:6px 0;max-width:none}
.ideas form{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.ideas select{width:auto}.idea.posted span{text-decoration:line-through;color:var(--muted)}
.meter{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin:12px 0;position:sticky;top:calc(var(--ab-h) + env(safe-area-inset-top,0px) + 8px);z-index:4}
.bar2{position:relative;height:12px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:6px}
.bar2 i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.bar2 i.ok{background:var(--accent)}.bar2 i.long{background:var(--over)}.bar2 i.short{background:var(--attn)}
.bar2 .mark{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.5}
.warns{margin:6px 0 0;padding-left:18px;color:var(--over);font-size:.88rem}.warns:empty{display:none}
.sect-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.sect{margin:10px 0}.sect textarea{margin-top:8px}.sect label{margin-top:8px}
.citem{border-top:1px solid var(--line);padding:12px 0;display:flex;flex-direction:column;gap:8px}.citem:first-of-type{border-top:0}
.citem.done b{color:var(--accent)}label.check.big{font-size:1rem}label.check.big input{margin-right:6px}
.acts{padding-left:22px}.act{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--grp,var(--accent));border-radius:var(--radius);padding:12px 14px;margin:10px 0;max-width:none}.act p{margin:6px 0;color:var(--muted);font-size:.92rem}
.claude-out{white-space:pre-wrap;word-wrap:break-word;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px;font:inherit;font-size:.95rem}.ask{margin-top:16px}

/* ---- print: content only ---- */
@media print{
.appbar,#nav,.no-print,button,.btn,.filters,.skip{display:none!important}
body{background:#fff;color:#000;font-size:11pt}.shell{display:block}main{padding:0}
.card,.act,table{background:#fff;border:1px solid #000;break-inside:avoid}th,td{border:1px solid #000;color:#000}
.muted,h2,h3,h4,a{color:#000!important}.badge{border:1px solid #000;color:#000;background:#fff}
}
@media (max-width:600px){.hero{gap:12px}.hero-big{font-size:1.3rem}.ring{width:88px;height:88px}}
.citem label.check{align-self:flex-start}

@media (max-width:600px){main{padding-left:16px;padding-right:16px}}
.toggle button{padding:10px 18px;border:0;background:transparent;color:var(--ink);font:inherit;min-height:44px;cursor:pointer}.toggle button.on{background:var(--accent);color:var(--on-accent);font-weight:700}
button.linkbtn{border:0;background:transparent;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer;padding:0;min-height:32px}
.schip{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:.78rem;white-space:nowrap}
.schip.ok{border-color:var(--accent);color:var(--accent)}.schip.err{border-color:var(--over);color:var(--over);background:var(--over-soft)}
@media (min-width:700px){.schip{margin-left:auto}}

#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

async function flush() {

/* ================= dashboard math ================= */

function snapshotFor(platform, days) {
  const rows = S.snaps.filter(s => s.platform === platform && s.window_days === days).sort((a, b) => b.window_end.localeCompare(a.window_end));

}
function priorSnapshot(s) {
  if (!s.window_start) return null;
  const pe = addDays(s.window_start, -1);
  return S.snaps.find(x => x.platform === s.platform && x.window_days === s.window_days && x.window_end === pe) || null;

/* % change vs the prior window: from a stored prior snapshot if there is one, else the % the app reported */
function changes(s) {

  Object.keys(CHANGE_LABELS).forEach(k => { if (prior && s[k] != null && prior[k]) out[k] = (s[k] - prior[k]) / prior[k] * 100; });
  if (s.net_followers != null && s.prior_net_followers) out.net_followers = (s.net_followers - s.prior_net_followers) / s.prior_net_followers * 100;

}
function cardRows(platform, s) {

  }
  const sh = s.shares == null ? null : ratio(s.shares, views, 1000);

  rows.push(['Profile view → follow', fpct(ptf), ptf != null ? 'net followers ÷ profile views' : 'needs profile views + net followers']);

}
function postRowsForWindow(days, loose) {
  const allowed = new Set([days]);
  if (loose && days === 28) allowed.add(30);
  if (loose && days === 30) allowed.add(28);
  const best = {};
  S.metrics.forEach(m => {
    if (!allowed.has(m.window_days)) return;
    const p = byId('posts', m.post_id);
    if (!p) return;
    const row = Object.assign({}, m, { id: p.id, title: p.title, platform: p.platform, topic_tag: p.topic_tag, story_key: p.story_key,
      series_name: p.series_id ? ((byId('series', p.series_id) || {}).name || null) : null });
    const cur = best[p.id];
    if (!cur || (row.window_days === days && cur.window_days !== days) || (row.window_days === cur.window_days && row.window_end > cur.window_end)) best[p.id] = row;

}

  const out = Object.keys(groups).map(key => {

    const shRs = rs.filter(r => r.shares != null && r.views);
    const sh = ratio(shRs.reduce((a, r) => a + r.shares, 0), shRs.reduce((a, r) => a + r.views, 0), 1000);
    const st = rs.filter(r => r.stayed_pct != null).map(r => r.stayed_pct);
    return { key, n: rs.length, views: vw.length ? vw.reduce((a, b) => a + b, 0) : null, eng, sh, stayed: st.length ? st.reduce((a, b) => a + b, 0) / st.length : null,
      plats: Array.from(new Set(rs.map(r => r.platform))).sort() };
  });
  out.sort((a, b) => (a.key === emptyLabel) - (b.key === emptyLabel) || (b.views || 0) - (a.views || 0));
  return out;
}

/* ================= weekly review ================= */
const REVIEW_METRICS = [['views', 'Views', 0], ['viewers', 'Viewers', 0], ['engaged_views', 'Engaged views', 0], ['profile_views', 'Profile views', 0],
  ['likes', 'Likes', 0], ['comments', 'Comments', 0], ['shares', 'Shares', 0], ['interactions', 'Interactions', 0], ['net_followers', 'Net followers', 0], ['watch_hours', 'Watch time (hrs)', 1]];
const AUTO_PREF = [28, 60, 90, 30, 14];
const pctChange = (now, base) => (now == null || base == null || base <= 0) ? null : (now - base) / base * 100;

function derivedRates(platform, v) {
  const views = v.views;
  let eng;
  if (platform === 'instagram') eng = v.interactions;
  else if (platform === 'youtube') eng = v.engaged_views;
  else eng = v.likes == null ? null : (v.likes || 0) + (v.comments || 0) + (v.shares || 0);
  const ok = (a, b) => a != null && b;
  return {
    eng: ok(eng, views) ? eng / views * 100 : null,
    shares1k: ok(v.shares, views) ? v.shares / views * 1000 : null,
    ptf: ok(v.net_followers, v.profile_views) ? v.net_followers / v.profile_views * 100 : null,
    fol1k: ok(v.net_followers, v.viewers) ? v.net_followers / v.viewers * 1000 : null
  };
}
function findBaseline(s7, base) {
  let rows = S.snaps.filter(r => r.platform === s7.platform && r.id !== s7.id && r.window_days >= 14);
  if (base !== 'auto') rows = rows.filter(r => r.window_days === base);
  const order = r => { const i = AUTO_PREF.indexOf(r.window_days); return i < 0 ? 99 : i; };
  const prevEnd = s7.window_start ? addDays(s7.window_start, -1) : null;
  const exact = rows.filter(r => prevEnd && r.window_end === prevEnd).sort((a, b) => order(a) - order(b));
  if (exact.length) {
    const w = exact[0], per7 = {};
    REVIEW_METRICS.forEach(m => { per7[m[0]] = w[m[0]] != null ? w[m[0]] / w.window_days * 7 : null; });
    return { kind: 'exact', snap: w, days: w.window_days, per7 };
  }
  const inside = rows.filter(r => s7.window_start && r.window_start && r.window_start <= s7.window_start && r.window_end >= s7.window_end && r.window_days - 7 >= 7)
    .sort((a, b) => order(a) - order(b));
  if (inside.length) {
    const w = inside[0], rest = w.window_days - 7, per7 = {};
    REVIEW_METRICS.forEach(m => { const a = w[m[0]], b = s7[m[0]]; per7[m[0]] = (a != null && b != null && a >= b) ? (a - b) / rest * 7 : null; });
    return { kind: 'derived', snap: w, days: rest, per7 };
  }
  return null;
}
function baselineLabel(b) {
  const w = b.snap;
  if (b.kind === 'exact') return 'the prior ' + w.window_days + ' days (' + windowLabel(w) + '), averaged per 7 days';
  return 'the earlier ' + b.days + ' days: your ' + w.window_days + 'd snapshot (' + windowLabel(w) + ') minus this week, averaged per 7 days';
}
function platformSummary(platform, base) {
  const s7 = S.snaps.filter(s => s.platform === platform && s.window_days === 7).sort((a, b) => b.window_end.localeCompare(a.window_end))[0];
  if (!s7) return { platform, s7: null };
  const b = findBaseline(s7, base);
  const week = {};
  REVIEW_METRICS.forEach(m => { week[m[0]] = s7[m[0]]; });
  const rows = [];
  REVIEW_METRICS.forEach(m => {
    if (week[m[0]] == null) return;
    const bv = b ? b.per7[m[0]] : null;
    rows.push({ key: m[0], label: m[1], dec: m[2], week: week[m[0]], base: bv, chg: pctChange(week[m[0]], bv) });
  });
  const chg = {};
  rows.forEach(r => { chg[r.key] = r.chg; });
  return { platform, s7, baseline: b, rows, week, weekRates: derivedRates(platform, week), baseRates: b ? derivedRates(platform, b.per7) : null, chg };
}
function bestStories() {
  const best = {};
  S.metrics.forEach(m => { if (m.views != null && (!best[m.post_id] || m.window_days > best[m.post_id].window_days)) best[m.post_id] = m; });
  const stories = {};
  S.posts.forEach(p => {
    if (!p.story_key) return;
    const s = stories[p.story_key] = stories[p.story_key] || { views: 0, platforms: new Set() };
    s.platforms.add(p.platform);
    if (best[p.id]) s.views += best[p.id].views;
  });
  return Object.keys(stories).filter(k => stories[k].views > 0).map(k => [k, stories[k]]).sort((a, b) => b[1].views - a[1].views);
}
function scriptLink(story) {
  let idea = null;
  if (story) {
    const sids = new Set(S.posts.filter(p => p.story_key === story && p.series_id).map(p => p.series_id));
    idea = S.ideas.filter(i => i.status === 'idea' && sids.has(i.series_id)).sort((a, b) => a.id - b.id)[0] || null;
  }
  if (!idea) idea = S.ideas.filter(i => i.status === 'idea').sort((a, b) => a.id - b.id)[0] || null;
  if (idea) return [{ go: 'scripts', sub: 'new', series: idea.series_id, idea: idea.id }, 'Write a script: "' + idea.idea + '"'];
  return [{ go: 'scripts', sub: 'new' }, 'Start a new script'];
}
function checklistProgress() {
  return [S.checklist.filter(c => c.done).length, S.checklist.length];
}
function suggest(sums, todayIso) {
  const acts = [];
  const stories = bestStories();
  const top = stories.length ? stories[0][0] : null;
  sums.forEach(s => {
    if (!s.s7) return;
    const name = PNAME[s.platform], w = s.week, chg = s.chg.views;
    if (chg != null && chg <= DROP) {
      const [link, lt] = scriptLink(top);
      let why = name + ' views were ' + fint(w.views) + ' this week vs about ' + fint(s.baseline.per7.views) + ' per week in the baseline (' + (chg >= 0 ? '+' : '') + chg.toFixed(0) + '%).';
      if (top) why += ' Your strongest story so far is "' + top + '" (' + fint(stories[0][1].views) + ' views).';
      acts.push({ pri: 100, title: 'Rebuild momentum on ' + name + ': post the next part of your best story', why, link, linkText: lt });
    }
    const r = s.weekRates;
    if (r.fol1k != null && r.fol1k < 5 && w.viewers) {
      const nv = s.s7.new_viewers != null ? ' About ' + (s.s7.new_viewers / w.viewers * 100).toFixed(0) + '% of viewers were new.' : '';
      acts.push({ pri: 90, title: 'Fix follow conversion on ' + name + ': add a direct follow ask and a next-part pointer to every Close',
        why: (w.net_followers >= 0 ? '+' : '') + w.net_followers + ' net followers from ' + fint(w.viewers) + ' viewers this week (' + r.fol1k.toFixed(1) + ' per 1K viewers).' + nv + ' Give first-time viewers a reason to follow.',
        link: { go: 'scripts' }, linkText: 'Open the script builder' });
    }
    if (r.shares1k != null && r.shares1k < 1) {
      acts.push({ pri: 80, title: 'Make your next ' + name + ' post shareable: end the Takeaway with "send this to a first-year teacher"',
        why: fint(w.shares) + ' shares on ' + fint(w.views) + ' views this week (' + r.shares1k.toFixed(2) + ' per 1K views).', link: { go: 'scripts' }, linkText: 'Open the script builder' });
    }
  });
  for (const [story, info] of stories) {
    const missing = PLATFORMS.filter(p => !info.platforms.has(p[0])).map(p => p[1]);
    if (missing.length) {
      const have = PLATFORMS.filter(p => info.platforms.has(p[0])).map(p => p[1]).join(', ');
      acts.push({ pri: 70, title: 'Repurpose "' + story + '" to ' + missing.join(' and '),
        why: 'It has ' + fint(info.views) + ' views on ' + have + ' only. Same story, new platform audience (story keys link them).', link: { go: 'posts', sub: 'new' }, linkText: 'Add the post' });
      break;
    }
  }
  const weekAgo = addDays(todayIso, -6);
  const dated = S.posts.filter(p => p.post_date && p.post_date >= weekAgo && p.post_date <= todayIso).length;
  if (S.posts.some(p => p.post_date) && dated < 3) {
    acts.push({ pri: 60, title: 'Post at least 3 times this week', why: 'Only ' + dated + ' post(s) are dated in the last 7 days (dates may be approximate).', link: { go: 'posts', sub: 'new' }, linkText: 'Log a post' });
  }
  const low = S.metrics.filter(m => m.stayed_pct != null).sort((a, b) => a.stayed_pct - b.stayed_pct)[0];
  if (low && low.stayed_pct < 50) {
    const p = byId('posts', low.post_id);
    if (p) acts.push({ pri: 50, title: 'Rewrite the hook on "' + p.title + '"', why: 'Only ' + low.stayed_pct.toFixed(1) + '% stayed to watch, your lowest. Try a hook from your library that held viewers better.', link: { go: 'hooks' }, linkText: 'Open the hook library' });
  }
  const [done, total] = checklistProgress();
  if (done < total) {
    const item = S.checklist.find(c => !c.done);
    acts.push({ pri: 40, title: 'Finish the conversion checklist', why: 'Nearly every viewer is a first-timer, so your profile has to convert them.' +
      (item ? ' Next up: ' + PNAME[item.platform] + ' ' + item.item_key.replace(/_/g, ' ') + '.' : ''), link: { go: 'checklist' }, linkText: 'Open the checklist' });
  }
  const [lk, lt] = scriptLink(top);
  acts.push({ pri: 30, title: 'Write the next part of a series', why: 'Keeps viewers coming back for the next part.', link: lk, linkText: lt });
  acts.sort((a, b) => b.pri - a.pri);
  return acts;
}

    '<form data-form="ideaAdd" data-id="' + s.id + '" class="stack">' + field('idea', 'Idea for Part ' + next, '', 'text', 'required placeholder="e.g. What I changed after the conference"') + '<button class="btn">Add idea</button></form>' +
    '<details><summary>Edit or delete series</summary><form data-form="seriesEdit" data-id="' + s.id + '" class="stack">' + field('name', 'Name', s.name, 'text', 'required') +

/* ================= Hooks ================= */
function hookPerformance(linked) {
  const byWin = {};
  linked.forEach(([p]) => metricsFor(p.id).forEach(m => {
    const w = byWin[m.window_days] = byWin[m.window_days] || { posts: new Set(), views: 0, hasViews: false, stayed: [] };
    w.posts.add(p.id);
    if (m.views != null) { w.views += m.views; w.hasViews = true; }
    if (m.stayed_pct != null) w.stayed.push(m.stayed_pct);
  }));
  const keys = Object.keys(byWin).map(Number).sort((a, b) => a - b);
  if (!keys.length) return '<p class="muted">No performance data yet (link posts that used this hook, with metrics).</p>';
  return '<div class="scroll"><table><thead><tr><th>Window</th><th>Posts</th><th>Views</th><th>Avg stayed</th></tr></thead><tbody>' + keys.map(d => {
    const w = byWin[d], st = w.stayed.length ? w.stayed.reduce((a, b) => a + b, 0) / w.stayed.length : null;
    return '<tr><td>' + d + 'd</td><td>' + w.posts.size + '</td><td>' + (w.hasViews ? fint(w.views) : '—') + '</td><td>' + fpct(st) + '</td></tr>';
  }).join('') + '</tbody></table></div>';
}
function viewHooks() {
  const q = UI.hookQ.toLowerCase(), tag = UI.hookTag;
  const tagCount = {};
  S.hooks.forEach(h => splitTags(h.tags).forEach(t => { tagCount[t] = (tagCount[t] || 0) + 1; }));
  const shown = S.hooks.slice().sort((a, b) => b.id - a.id).filter(h => {
    if (q && (h.text + ' ' + (h.tags || '') + ' ' + (h.notes || '')).toLowerCase().indexOf(q) < 0) return false;
    return !tag || splitTags(h.tags).indexOf(tag) >= 0;
  });
  let chips = Object.keys(tagCount).sort().map(t => '<button type="button" class="chip' + (t === tag ? ' on' : '') + '" data-act="hookTag" data-tag="' + esc(t) + '">#' + esc(t) + ' <small>' + tagCount[t] + '</small></button>').join('');
  if (tag) chips = '<button type="button" class="chip" data-act="hookTag" data-tag="">clear filter ✕</button> ' + chips;
  const cards = shown.map(h => {
    const linked = hookPostsFor(h);
    return '<article class="card"><h3>“' + esc(h.text) + '” ' + badge(h.source) + '</h3><div>' + splitTags(h.tags).map(t => '<button type="button" class="chip" data-act="hookTag" data-tag="' + esc(t) + '">#' + esc(t) + '</button>').join('') + '</div>' +
      (h.notes ? '<p class="note">' + esc(h.notes) + '</p>' : '') + '<h4>Performance <small class="muted">by window: compare like with like</small></h4>' + hookPerformance(linked) +
      '<h4>Posts that used it (' + linked.length + ')</h4>' + (linked.map(([p]) => postLine(p)).join('') || '<p class="muted">None linked yet.</p>') +
      '<a class="btn small" ' + goAttrs({ go: 'hooks', sub: 'edit', id: h.id }) + '>Edit / link posts</a></article>';
  }).join('');
  const saved = new Set(S.hooks.map(h => h.text.trim().toLowerCase())), seen = new Set();
  const cands = S.posts.filter(p => p.hook_text && p.hook_text.trim()).filter(p => { const k = p.hook_text.trim().toLowerCase(); if (saved.has(k) || seen.has(k)) return false; seen.add(k); return true; });
  const candHtml = cands.length ? '<h2>Hooks from your posts not yet saved</h2><ul class="ideas">' + cands.map(p => '<li><span>“' + esc(p.hook_text) + '” <span class="muted">(' + esc(PNAME[p.platform]) + ')</span></span>' +
    '<button type="button" class="btn small" data-act="hookFromPost" data-id="' + p.id + '">Save to library</button></li>').join('') + '</ul>' : '';
  return '<h1>Hook library</h1><form class="filters" data-form="hookSearch">' + field('q', 'Search hooks', UI.hookQ, 'search') + '<button class="btn">Search</button></form><div>' + chips + '</div>' +
    '<p class="muted">' + shown.length + ' hook(s). A post counts as using a hook if you linked it, or if its hook text matches the hook exactly.</p><div class="grid">' + (cards || '<p class="muted">No hooks match.</p>') + '</div>' + candHtml +
    '<h2>Add a hook</h2><form data-form="hookNew" class="stack">' + field('text', 'Hook text', '', 'text', 'required') + field('tags', 'Tags (comma-separated)', '', 'text', 'placeholder="e.g. observation, air-force, nervous"') +
    '<label>Notes<textarea name="notes" rows="2"></textarea></label><button class="btn primary">Save hook</button></form>';

/* live meter, warnings, hook picker, copy button (runs after the script form renders) */
function bindScriptForm() {
  const form = $('#scriptform');
  if (!form) return;
  const el = n => form.elements[n];
  function update() {
    let total = 0; const w = {};
    $$('textarea[data-spoken]', form).forEach(t => {
      w[t.name] = countWords(t.value); total += w[t.name];
      const c = $('.cnt[data-for="' + t.name + '"]'); if (c) c.textContent = w[t.name] + ' words · ~' + Math.round(w[t.name] / WPS) + 's';
    });

    const fill = $('#meterfill');

    fill.className = sec < MIN_S ? 'short' : (sec > MAX_S ? 'long' : 'ok');
    const warns = [];
    if (sec > MAX_S) warns.push('Over ' + MAX_S + 's: trim ' + (sec - MAX_S) + 's (about ' + Math.ceil((sec - MAX_S) * WPS) + ' words).');
    if (sec < MIN_S && total > 0) warns.push('Under ' + MIN_S + 's: add about ' + Math.ceil((MIN_S - sec) * WPS) + ' words (a detail in the Reveal usually works best).');
    if (!el('hook_onscreen').value.trim()) warns.push('Add the on-screen hook text.');
    if (w.reveal > 35) warns.push('Reveal is long. Keep it to ONE specific detail.');
    if (w.takeaway > 25) warns.push('Takeaway is long. One lesson, one sentence.');
    if (!/follow|share|send|subscribe/i.test(el('close_ask').value)) warns.push('Close needs a direct follow or share ask.');

}

function rnum(v, dec) {
  if (v == null) return '—';
  if (v === Math.trunc(v) && !dec) return v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  const d = Math.abs(v) >= 10 ? dec : Math.max(dec, 1);
  return v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function reviewTable(s) {

      (c == null ? '—' : (c >= 0 ? '+' : '') + c.toFixed(0) + '%') + (flag ? ' ⚠' : '') + '</td></tr>';
  }).join('');
  const wr = s.weekRates, br = s.baseRates;
  [['Engagement rate', 'eng', x => fpct(x, 2)], ['Shares / 1K views', 'shares1k', x => x == null ? '—' : x.toFixed(2)], ['Profile view → follow', 'ptf', x => fpct(x)], ['Net follows / 1K viewers', 'fol1k', x => x == null ? '—' : x.toFixed(1)]].forEach(x => {
    if (wr[x[1]] == null && (!br || br[x[1]] == null)) return;

/* ================= CSV: parse, import, export ================= */
const PLATFORM_ALIASES = { tiktok: 'tiktok', 'tik tok': 'tiktok', tt: 'tiktok', youtube: 'youtube', 'youtube shorts': 'youtube', yt: 'youtube', shorts: 'youtube', instagram: 'instagram', 'instagram reels': 'instagram', ig: 'instagram', reels: 'instagram' };
const HEADER_ALIASES = { date: 'post_date', posted: 'post_date', posted_date: 'post_date', hook: 'hook_text', tag: 'topic_tag', topic: 'topic_tag', series: 'series_name', part: 'series_part', story: 'story_key',
  window: 'window_days', days: 'window_days', end_date: 'window_end', window_end_date: 'window_end', follows: 'follows_gained', followers_gained: 'follows_gained', stayed: 'stayed_pct', stayed_to_watch: 'stayed_pct',
  stayed_to_watch_pct: 'stayed_pct', 'stayed_to_watch_%': 'stayed_pct' };
const POST_COLS = ['title', 'platform', 'post_date', 'date_approx', 'hook_text', 'topic_tag', 'series_name', 'series_part', 'story_key', 'flag', 'notes'];
const INT_COLS = ['views', 'viewers', 'likes', 'comments', 'shares', 'follows_gained'];
const FLAT_COLS = POST_COLS.concat(['window_days', 'window_end'], INT_COLS, ['stayed_pct']);

function parseCsvText(text) {
  text = String(text || '').replace(/^﻿/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
function csvNum(v, int) {
  v = String(v == null ? '' : v).trim().replace(/,/g, '').replace(/%/g, '');
  if (!v || /^(n\/a|na|null|none|-|—)$/i.test(v)) return null;
  const f = Number(v);
  if (!isFinite(f)) throw new Error('not a number: "' + v + '"');
  return int ? Math.round(f) : f;
}
function csvDate(v) {
  v = String(v || '').trim();
  if (!v) return null;
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v);
  if (m) return m[1] + '-' + m[2].padStart(2, '0') + '-' + m[3].padStart(2, '0');
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})$/.exec(v);
  if (m) return (m[3].length === 2 ? '20' + m[3] : m[3]) + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0');
  const d = new Date(v + ' 12:00');
  if (!isNaN(d) && /[a-z]/i.test(v)) return iso(d);
  throw new Error('unrecognized date: "' + v + '" (use YYYY-MM-DD)');
}
function parseImport(text) {
  const grid = parseCsvText(text);
  if (!grid.length) return { rows: [], unknown: [] };
  const header = grid[0].map(h => { h = h.trim().toLowerCase().replace(/[ -]/g, '_'); return HEADER_ALIASES[h] || h; });
  const unknown = header.filter(h => h && FLAT_COLS.indexOf(h) < 0);
  const rows = [];
  grid.slice(1).forEach((cells, idx) => {
    if (!cells.some(c => c.trim())) return;
    const raw = {}; header.forEach((h, j) => { if (FLAT_COLS.indexOf(h) >= 0) raw[h] = cells[j] == null ? '' : cells[j]; });
    const out = { line: idx + 2 };
    try {
      out.title = (raw.title || '').trim();
      if (!out.title) throw new Error('title is required');
      const p = (raw.platform || '').trim().toLowerCase();
      if (!PLATFORM_ALIASES[p]) throw new Error('platform must be TikTok, YouTube or Instagram (got "' + p + '")');
      out.platform = PLATFORM_ALIASES[p];
      out.post_date = csvDate(raw.post_date);
      const da = (raw.date_approx || '').trim().toLowerCase();
      out.date_approx = da ? (['1', 'true', 'yes', 'y'].indexOf(da) >= 0 ? 1 : 0) : null;
      ['hook_text', 'topic_tag', 'series_name', 'story_key', 'flag', 'notes'].forEach(k => { out[k] = (raw[k] || '').trim() || null; });
      out.series_part = csvNum(raw.series_part, true);
      INT_COLS.forEach(k => { out[k] = csvNum(raw[k], true); });
      out.stayed_pct = csvNum(raw.stayed_pct);
      const wd = csvNum(raw.window_days, true);
      out.has_metrics = INT_COLS.concat(['stayed_pct']).some(k => out[k] != null);
      if (out.has_metrics && wd != null && WINDOWS.indexOf(wd) < 0) throw new Error('window_days must be ' + WINDOWS.join(', '));
      out.window_days = wd || 28;
      out.window_end = csvDate(raw.window_end) || today();

  });

}
const findPost = (platform, title) => S.posts.find(p => p.platform === platform && p.title.toLowerCase() === title.toLowerCase());
function planImport(rows) {
  const seen = new Set();
  rows.forEach(r => {
    if (r.error) { r.status = 'error'; return; }
    const key = r.platform + '|' + r.title.toLowerCase();
    if (findPost(r.platform, r.title) || seen.has(key)) r.status = 'update'; else { r.status = 'new'; seen.add(key); }
  });
  return rows;
}
function applyImport(rows) {
  const st = { added: 0, updated: 0, metrics: 0, skipped: 0 };
  rows.forEach(r => {
    if (r.error) { st.skipped++; return; }
    let seriesId = null;
    if (r.series_name) {
      let s = S.series.find(x => x.name.toLowerCase() === r.series_name.toLowerCase());
      if (!s) { s = { id: nid(), name: r.series_name, description: null, source: 'csv' }; S.series.push(s); }
      seriesId = s.id;
    }
    const f = { post_date: r.post_date, hook_text: r.hook_text, topic_tag: r.topic_tag, series_id: seriesId, series_part: r.series_part, story_key: r.story_key, flag: r.flag, notes: r.notes };
    if (r.date_approx != null) f.date_approx = r.date_approx; else if (r.post_date) f.date_approx = 0;
    let p = findPost(r.platform, r.title);
    if (p) { Object.keys(f).forEach(k => { if (f[k] != null) p[k] = f[k]; }); st.updated++; }
    else {
      p = Object.assign({ id: nid(), title: r.title, platform: r.platform, post_date: null, date_approx: 0, hook_text: null, topic_tag: null, series_id: null, series_part: null, story_key: null, flag: null, notes: null, source: 'csv' },
        Object.fromEntries(Object.keys(f).filter(k => f[k] != null).map(k => [k, f[k]])));
      S.posts.push(p); st.added++;
    }
    if (r.has_metrics) {
      const days = r.window_days, end = r.window_end, vals = {};
      INT_COLS.concat(['stayed_pct']).forEach(k => { vals[k] = r[k]; });
      let m = S.metrics.find(x => x.post_id === p.id && x.window_days === days && x.window_end === end);
      if (m) { Object.keys(vals).forEach(k => { if (vals[k] != null) m[k] = vals[k]; }); m.source = 'csv'; }
      else S.metrics.push(Object.assign({ id: nid(), post_id: p.id, window_start: addDays(end, -(days - 1)), window_end: end, window_days: days, source: 'csv' }, vals));
      st.metrics++;
    }
  });
  markDirty('posts', 'metrics', 'series');
  return st;
}

function csvCell(v) {
  if (v == null) return '';

}

const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

/* ================= global search ================= */
function searchAll(term) {
  term = term.trim().toLowerCase();
  if (term.length < 2) return [];
  const out = [], has = v => v && String(v).toLowerCase().indexOf(term) >= 0;
  const snip = vals => { for (const v of vals) { if (has(v)) { const i = v.toLowerCase().indexOf(term), a = Math.max(0, i - 40); return (a ? '…' : '') + v.slice(a, i + term.length + 60); } } return ''; };
  S.posts.forEach(p => { const f = [p.hook_text, p.topic_tag, p.story_key, p.notes, p.flag]; if (has(p.title) || f.some(has)) out.push({ title: p.title.slice(0, 90), tab: 'Post · ' + PNAME[p.platform].split(' ')[0], snip: snip(f), go: { go: 'posts', sub: 'edit', id: p.id } }); });
  S.hooks.forEach(h => { const f = [h.tags, h.notes]; if (has(h.text) || f.some(has)) out.push({ title: h.text.slice(0, 90), tab: 'Hook', snip: snip(f), go: { go: 'hooks', sub: 'edit', id: h.id } }); });
  S.scripts.forEach(s => { const f = TEXT_KEYS.map(k => s[k]); if (has(s.title) || f.some(has)) out.push({ title: (s.title || 'Untitled script').slice(0, 90), tab: s.is_template ? 'Template' : 'Script', snip: snip(f), go: { go: 'scripts', sub: 'edit', id: s.id } }); });
  S.series.forEach(s => { if (has(s.name) || has(s.description)) out.push({ title: s.name, tab: 'Series', snip: snip([s.description]), go: { go: 'series', id: s.id } }); });
  S.ideas.forEach(i => { if (has(i.idea)) { const s = byId('series', i.series_id); out.push({ title: i.idea.slice(0, 90), tab: 'Idea · ' + (s ? s.name : ''), snip: '', go: { go: 'series', id: i.series_id } }); } });
  out.sort((a, b) => (a.title.toLowerCase().indexOf(term) < 0) - (b.title.toLowerCase().indexOf(term) < 0));
  return out.slice(0, 14);
}

/* ================= shell, router, events ================= */
const NAV_GROUPS = [
  ['plan', 'Today', 'home', [['today', 'Today', 'home']], true],
  ['plan', 'Plan', 'calendar', [['series', 'Series', 'layers'], ['scripts', 'Scripts', 'file'], ['hooks', 'Hooks', 'bookmark']], false],
  ['grade', 'Track', 'chart', [['posts', 'Posts', 'list'], ['stats', 'Channel stats', 'activity'], ['review', 'Weekly review', 'target']], false],
  ['manage', 'Checklist', 'check', [['checklist', 'Checklist', 'check']], true],
  ['support', 'Data', 'database', [['data', 'Data', 'database']], true]
];
const ICONS = {
  brand: '<rect x="2" y="6" width="14" height="12" rx="2"/><path d="M22 8l-6 4 6 4z"/>', home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar: '<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>', chart: '<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',
  check: '<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>', database: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>',
  layers: '<path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/>', file: '<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>', bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>', activity: '<path d="M3 12h4l3-8 4 16 3-8h4"/>', target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>'
};
const icon = (n, x) => '<svg class="ic ' + (x || '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[n] + '</svg>';
const TABS = ['today', 'posts', 'stats', 'series', 'hooks', 'scripts', 'checklist', 'review', 'data'];
let R = { tab: 'today', sub: null, id: null, params: {} }, loaded = false;

function go(tab, sub, id, params) {
  R = { tab, sub: sub || null, id: id || null, params: params || {} };
  closeMenus(); render(); window.scrollTo(0, 0);
  try { history.replaceState(null, '', '#' + tab); } catch (e) { /* frame may refuse */ }
}
function groupOfTab(tab) { for (let i = 0; i < NAV_GROUPS.length; i++) if (NAV_GROUPS[i][3].some(t => t[0] === tab)) return i; return 0; }

function buildShell() {
  $('#app').innerHTML = '<a class="skip" href="#main">Skip to content</a>' +
    '<header class="appbar"><button class="ab-brand" id="aboutBtn" type="button" aria-expanded="false" aria-controls="aboutPop">' + icon('brand') + '<span><span class="ab-long">Channel </span>Builder</span></button>' +
    '<div class="ab-search"><label class="sr-only" for="gsearch">Search posts, hooks, scripts and series</label>' + icon('search') +
    '<input type="text" id="gsearch" placeholder="Search: hook, observation, F-16" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="gresults" aria-autocomplete="list">' +
    '<ul id="gresults" role="listbox" aria-label="Search results" hidden></ul></div><span class="ab-spacer"></span>' +
    '<span class="schip" id="schip" role="status">Loading…</span>' +
    '<button class="ico" id="searchBtn" type="button" aria-label="Search">' + icon('search') + '</button>' +
    '<button class="ico" id="themeBtn" type="button" aria-label="Switch light or dark mode">' + icon('moon', 'ic-moon') + icon('sun', 'ic-sun') + '</button>' +
    '<div id="aboutPop" hidden><p><strong>Channel Builder</strong></p><p>For the Second Mission channel on TikTok, YouTube Shorts and Instagram Reels. ' +
    'Your data is kept in this page\'s own database, so it follows you between your phone and computer.</p><p class="small">Use Data to export a backup of everything.</p></div></header>' +
    '<div class="shell"><nav id="nav" aria-label="Sections"><div class="inner"></div></nav><div class="content"><main id="main"></main></div></div>' +
    '<div id="cfmBar" role="alertdialog" aria-live="assertive" hidden></div><div id="toast" role="status" aria-live="polite"></div><div id="txtBox" hidden></div>';
}
function renderNav() {
  const gi = groupOfTab(R.tab);
  $('#nav .inner').innerHTML = NAV_GROUPS.map((g, i) => {
    const tabs = g[3].map(t => '<a class="tab" href="#' + t[0] + '" data-go="' + t[0] + '"' + (t[0] === R.tab ? ' aria-current="page"' : '') + '>' + icon(t[2]) + '<span class="tl">' + esc(t[1]) + '</span></a>').join('');
    if (g[4]) return '<div class="grp solo' + (i === gi ? ' has-active' : '') + '" data-grp="' + g[0] + '"><div class="grp-tabs">' + tabs + '</div></div>';
    return '<div class="grp' + (i === gi ? ' has-active' : '') + '" data-grp="' + g[0] + '"><span class="grp-label" aria-hidden="true">' + esc(g[1]) + '</span>' +
      '<button class="grp-toggle" type="button" aria-expanded="false" aria-controls="gt-' + i + '">' + icon(g[2]) + '<span>' + esc(g[1]) + '</span></button><div class="grp-tabs" id="gt-' + i + '">' + tabs + '</div></div>';
  }).join('');
}
function viewFor() {
  const sub = R.sub, id = R.id, p = R.params;
  switch (R.tab) {
    case 'posts': return sub === 'new' ? viewPostForm(null) : sub === 'edit' ? viewPostForm(id) : viewPosts();
    case 'stats': return sub === 'new' ? viewStatsForm(null, p) : sub === 'edit' ? viewStatsForm(id) : viewStats();
    case 'series': return id ? viewSeriesDetail(id) : viewSeriesList();
    case 'hooks': return sub === 'edit' ? viewHookEdit(id) : viewHooks();
    case 'scripts': return sub === 'new' ? viewScriptForm(null, p) : sub === 'edit' ? viewScriptForm(id) : viewScripts();
    case 'checklist': return viewChecklist();
    case 'review': return viewReview();
    case 'data': return sub === 'preview' ? viewImportPreview() : viewData();
    default: return viewToday();
  }
}
function render() {
  const main = $('#main');
  if (!loaded) { main.innerHTML = '<section class="panel active"><p class="muted">Loading your data…</p></section>'; return; }
  renderNav();
  const grp = NAV_GROUPS[groupOfTab(R.tab)][0];
  let html;
  try { html = viewFor(); } catch (e) { html = '<h1>Something went wrong</h1><p class="muted">' + esc(e && e.message) + '</p><p><a ' + goAttrs({ go: 'today' }) + '>Back to Today</a></p>'; if (window.console) console.error(e); }
  main.innerHTML = '<section class="panel active" data-grp="' + grp + '">' + html + '</section>';
  if (R.tab === 'scripts' && (R.sub === 'new' || R.sub === 'edit')) bindScriptForm();
}

/* ---- status, toast, confirm, copy ---- */
function setStatus(st) {
  const chip = $('#schip');
  if (!chip) return;
  const map = { saving: ['Saving…', ''], ok: ['Saved', 'ok'], local: ['Saved on this device', 'local'], error: ['Not saved', 'err'] };
  const m = map[st] || map.ok;
  chip.textContent = m[0]; chip.className = 'schip ' + m[1];
  chip.title = st === 'error' ? Store.error : st === 'local' ? 'This view has no database, so your data is kept in this browser only.' : '';
  if (st === 'error') toast(Store.error || 'Could not save');
}
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
let cfmYes = null;
function confirmBar(msg, onYes) {
  const b = $('#cfmBar');
  cfmYes = onYes;
  b.innerHTML = '<p>' + esc(msg) + '</p><div class="row"><button type="button" class="btn primary small" data-act="cfmYes">Yes</button><button type="button" class="btn small" data-act="cfmNo">Cancel</button></div>';
  b.hidden = false; $('[data-act=cfmYes]', b).focus();
}
ACTS.cfmYes = () => { const f = cfmYes; cfmYes = null; $('#cfmBar').hidden = true; if (f) f(); };
ACTS.cfmNo = () => { cfmYes = null; $('#cfmBar').hidden = true; };
function showText(title, text) {
  const b = $('#txtBox');
  b.innerHTML = '<div class="txt-card"><h3>' + esc(title) + '</h3><p class="muted">Select all and copy this text.</p><textarea readonly id="txtArea" rows="12">' + esc(text) + '</textarea>' +
    '<div class="row"><button type="button" class="btn primary small" data-act="txtCopy">Copy</button><button type="button" class="btn small" data-act="txtClose">Close</button></div></div>';
  b.hidden = false; const a = $('#txtArea'); a.focus(); a.select();
}
ACTS.txtClose = () => { $('#txtBox').hidden = true; };
ACTS.txtCopy = () => copyText($('#txtArea').value, 'Copied');
function copyText(text, msg) {
  const fallback = () => showText('Copy this text', text);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast(msg || 'Copied'), fallback);
    else fallback();
  } catch (e) { fallback(); }
}

/* ---- menus, search, theme, events ---- */
function closeMenus() {
  $$('#nav .grp.open').forEach(g => { g.classList.remove('open'); const t = $('.grp-toggle', g); if (t) t.setAttribute('aria-expanded', 'false'); });
  const pop = $('#aboutPop'); if (pop) { pop.hidden = true; $('#aboutBtn').setAttribute('aria-expanded', 'false'); }
  closeSearch();
}
let sel = -1, results = [];
function closeSearch() {
  const list = $('#gresults'), input = $('#gsearch'), bar = $('.appbar');
  if (!list) return;
  list.hidden = true; input.setAttribute('aria-expanded', 'false'); sel = -1; bar.classList.remove('searching');
}
function hl(text, q) {
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function runSearch() {
  const input = $('#gsearch'), list = $('#gresults'), q = input.value.trim();
  if (q.length < 2) { list.hidden = true; return; }
  results = searchAll(q);
  list.innerHTML = results.length ? results.map((r, i) => '<li role="option" id="gr' + i + '" data-i="' + i + '" aria-selected="false"><div class="r-top"><b>' + hl(r.title, q) + '</b><span class="r-tab">' + esc(r.tab) + '</span></div>' +
    (r.snip ? '<div class="r-snip">' + hl(r.snip, q) + '</div>' : '') + '</li>').join('') : '<li class="r-none" role="presentation">No matches for “' + esc(q) + '”.</li>';
  list.hidden = false; input.setAttribute('aria-expanded', 'true'); sel = -1;
}
function chooseResult(i) { const r = results[i]; if (r) { closeSearch(); $('#gsearch').value = ''; go(r.go.go, r.go.sub, r.go.id); } }
function setSel(i) {
  const items = $$('#gresults li[role=option]');
  if (!items.length) return;
  sel = (i + items.length) % items.length;
  items.forEach((li, k) => li.setAttribute('aria-selected', k === sel ? 'true' : 'false'));
  $('#gsearch').setAttribute('aria-activedescendant', items[sel].id); items[sel].scrollIntoView({ block: 'nearest' });
}
function wireEvents() {
  document.addEventListener('click', e => {
    const t = e.target;
    const nav = t.closest('[data-go]');
    if (nav) {
      e.preventDefault();
      const d = nav.dataset, params = {};
      ['platform', 'days', 'end', 'template', 'series', 'idea'].forEach(k => { if (d[k] != null) params[k] = d[k]; });
      go(d.go, d.sub, d.id, params); return;
    }
    const tog = t.closest('.grp-toggle');
    if (tog) {
      e.stopPropagation();
      const g = tog.parentNode, open = !g.classList.contains('open');
      $$('#nav .grp.open').forEach(x => { if (x !== g) x.classList.remove('open'); });
      g.classList.toggle('open', open); tog.setAttribute('aria-expanded', open ? 'true' : 'false'); return;
    }
    if (t.closest('#aboutBtn')) { e.stopPropagation(); const pop = $('#aboutPop'); pop.hidden = !pop.hidden; $('#aboutBtn').setAttribute('aria-expanded', pop.hidden ? 'false' : 'true'); return; }
    if (t.closest('#aboutPop')) return;
    if (t.closest('#themeBtn')) {
      const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('cb-theme', next); } catch (err) { /* ignore */ }
      return;
    }
    if (t.closest('#searchBtn')) { e.stopPropagation(); $('.appbar').classList.add('searching'); $('#gsearch').focus(); return; }
    const li = t.closest('#gresults li[data-i]');
    if (li) { chooseResult(+li.dataset.i); return; }
    const act = t.closest('[data-act]');
    if (act && ACTS[act.dataset.act]) { e.preventDefault(); ACTS[act.dataset.act](act, e); return; }
    if (!t.closest('#gsearch')) closeMenus();
  });
  document.addEventListener('submit', e => {
    const form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    let fd;
    try { fd = Object.fromEntries(new FormData(form, e.submitter)); } catch (err) { fd = Object.fromEntries(new FormData(form)); }
    if (FORMS[form.dataset.form]) FORMS[form.dataset.form](fd, form);
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.matches && t.matches('[data-autosubmit]')) { t.form.requestSubmit(); return; }
    if (t.id === 'csvfile' || t.id === 'jsonfile') {
      const f = t.files && t.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => { const box = $(t.id === 'csvfile' ? '#csvtext' : '#jsontext'); if (box) box.value = rd.result; };
      rd.readAsText(f);
    }
  });
  const input = $('#gsearch');
  input.addEventListener('input', runSearch);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); setSel(sel + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(sel - 1); }
    else if (e.key === 'Enter') { e.preventDefault(); chooseResult(sel >= 0 ? sel : 0); }
    else if (e.key === 'Escape') { closeSearch(); input.blur(); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#cfmBar').hidden) ACTS.cfmNo(); else if (!$('#txtBox').hidden) ACTS.txtClose(); else closeMenus(); }
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) { e.preventDefault(); $('.appbar').classList.add('searching'); input.focus(); }
  });
}

/* ================= boot ================= */
(async function boot() {
  buildShell();
  const h = (location.hash || '').replace('#', '');
  if (TABS.indexOf(h) >= 0) R.tab = h;
  wireEvents();
  render();
  await initStore();
  loaded = true;
  render();
})();

</script>
